<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Misbah & Friends — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f6f8;--panel:#fff;--panel2:#f9fafb;--text:#17181b;--muted:#7b8089;
      --line:#e8eaee;--gold:#b89543;--green:#2fa36b;--red:#d95c5c;--shadow:0 8px 30px rgba(19,25,35,.06);--radius:16px
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
    .sidebar{background:#171717;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
    .brand{padding:4px 10px 22px}.brand h1{font-family:"Playfair Display",serif;font-size:21px;margin:0}.brand p{font-size:11px;color:#9b9b9b;margin:4px 0 0}
    .nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#a9a9a9;padding:11px 12px;text-align:left;border-radius:10px;font-weight:600}
    .nav button:hover,.nav button.active{background:#252525;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}
    .side-bottom{margin-top:auto;border-top:1px solid #2c2c2c;padding-top:12px}.user-mini{font-size:12px;color:#aaa;padding:0 10px 10px}
    .logout{width:100%;border:0;background:#2a2020;color:#ff9494;padding:10px;border-radius:10px;font-weight:700}
    .main{padding:26px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
    .title h2{font-family:"Playfair Display",serif;font-size:29px;margin:0}.title p{color:var(--muted);font-size:13px;margin:5px 0 0}
    .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:#171717;color:#fff}.btn.gold{background:var(--gold)}.btn.green{background:var(--green)}
    .btn.light{background:#f0f1f3;color:#303238}.btn.danger{background:#fff0f0;color:var(--red)}.btn.sm{padding:7px 9px;font-size:12px}.btn:disabled{opacity:.65;cursor:not-allowed}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
    .card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:17px}
    .kicker{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}.big{font-size:25px;font-weight:800;margin-top:5px}.sub{font-size:12px;color:var(--muted);margin-top:4px}
    .panel{padding:17px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel-head h3{font-size:15px;margin:0}
    .filters{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;color:var(--text);outline:none}
    input:focus,select:focus,textarea:focus{border-color:#bfc4cc;box-shadow:0 0 0 3px rgba(20,20,20,.04)}.search{min-width:240px}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line)}
    td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}tr:last-child td{border-bottom:0}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700}.paid{background:#eaf7f0;color:#238255}.unpaid{background:#fff0f0;color:#b94848}
    .muted{color:var(--muted)}.actions{display:flex;gap:5px}.tabs{display:flex;gap:6px;background:#f1f2f4;padding:4px;border-radius:11px;width:max-content}
    .tabs button{border:0;background:transparent;border-radius:8px;padding:8px 12px;color:var(--muted);font-weight:700;font-size:12px}.tabs button.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.history-month{padding:10px 0 6px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
    .mobilebar{display:none}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.46);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}
    .modal{background:#fff;border-radius:18px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
    .modal-head h3{margin:0;font-size:17px}.x{border:0;background:#f1f2f4;border-radius:8px;width:32px;height:32px}.form{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}textarea{min-height:90px;resize:vertical}
    .modal-foot{padding:0 20px 18px;display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:20px;bottom:20px;background:#181818;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:1500;font-size:13px}.toast.error{background:#b94747}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#111}.login-card{width:min(420px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.25)}
    .login-card h1{font-family:"Playfair Display",serif;margin:0;font-size:28px}.login-card p{color:var(--muted);font-size:13px;margin:6px 0 22px}.login-card .field{margin-bottom:12px}.login-card .btn{width:100%;margin-top:5px}.login-error{font-size:12px;color:var(--red);min-height:18px;margin-top:8px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:18px 14px 84px}.mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#171717;padding:7px;z-index:900;overflow:auto;gap:4px}
      .mobilebar button{flex:1;min-width:68px;background:transparent;border:0;color:#9b9b9b;padding:8px 5px;border-radius:8px;font-size:10px;font-weight:700}.mobilebar button.active{background:#292929;color:#fff}.cards{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start}}
    @media(max-width:560px){.form{grid-template-columns:1fr}.field.full{grid-column:1}.search{min-width:0;width:100%}.filters{width:100%}.filters>*{flex:1}}
  </style>
</head>
<body>
<div id="login" class="login">
  <form class="login-card" id="loginForm">
    <h1>Misbah & Friends</h1><p>School administration panel <span style="opacity:.45">· v4</span></p>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <button class="btn gold" id="loginBtn" type="submit">Sign in</button>
    <div class="login-error" id="loginError"></div>
    <div id="loginStatus" style="font-size:11px;color:#7b8089;margin-top:4px;min-height:16px"></div>
  </form>
</div>
<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="brand"><h1>Misbah & Friends</h1><p>ADMINISTRATION</p></div>
    <nav class="nav" id="desktopNav"></nav>
    <div class="side-bottom"><div class="user-mini" id="userMini"></div><button class="logout" id="logoutBtn">Sign out</button></div>
  </aside>
  <main class="main"><div id="view"></div></main>
  <nav class="mobilebar" id="mobileNav"></nav>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>

<script>
const SUPABASE_URL = "https://xyrphosiclowqvjlwgbx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5cnBob3NpY2xvd3F2amx3Z2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTc5MjcsImV4cCI6MjA5NjA5MzkyN30.3xrMsxdbbi9V99g-c329VdBm2lL-zYsXxhHCXZsiFqg";
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const state={page:"dashboard",token:localStorage.getItem("misbah_admin_token")||"",user:null,profile:null,students:[],payments:[],classes:[],professors:[],events:[],selectedMonth:MONTHS[new Date().getMonth()],selectedYear:new Date().getFullYear(),paymentTab:"unpaid"};
const $=s=>document.querySelector(s);
const money=n=>"€"+Number(n||0).toLocaleString("en-GB",{maximumFractionDigits:2});
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmtDate=d=>d?new Date(d+(String(d).length<=10?"T00:00:00":"")).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";

function headers(){return{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+(state.token||SUPABASE_ANON_KEY),"Content-Type":"application/json",Prefer:"return=representation"}}
async function api(table,query="",options={}){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`,{...options,headers:{...headers(),...(options.headers||{})}});if(!r.ok)throw new Error(await r.text());if(r.status===204)return[];const t=await r.text();return t?JSON.parse(t):[]}
const db={select:(t,q="")=>api(t,q),insert:(t,d)=>api(t,"",{method:"POST",body:JSON.stringify(d)}),update:(t,id,d)=>api(t,`?id=eq.${encodeURIComponent(id)}`,{method:"PATCH",body:JSON.stringify(d)}),remove:(t,id)=>api(t,`?id=eq.${encodeURIComponent(id)}`,{method:"DELETE"})};

async function signIn(email,password){const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||"Login failed");return d}
async function getUser(token){const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+token}});if(!r.ok)throw new Error("Session expired");return r.json()}
function toast(msg,type="ok"){$("#toastRoot").innerHTML=`<div class="toast ${type==="error"?"error":""}">${esc(msg)}</div>`;setTimeout(()=>$("#toastRoot").innerHTML="",2600)}
const navItems=[["dashboard","Overview"],["students","Students"],["payments","Payments"],["classes","Classes"],["professors","Faculty"],["events","Events"]];
function navHtml(){return navItems.map(([key,label])=>`<button data-page="${key}" class="${state.page===key?"active":""}">${label}</button>`).join("")}
function renderNav(){$("#desktopNav").innerHTML=navHtml();$("#mobileNav").innerHTML=navHtml();document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()})}
async function loadAll(){
  const jobs=[
    ["students",db.select("students","?order=name")],
    ["payments",db.select("payments","?order=year.desc,month")],
    ["classes",db.select("classes","?order=name")],
    ["professors",db.select("professors","?order=name")],
    ["events",db.select("events","?order=date")]
  ];
  const results=await Promise.allSettled(jobs.map(x=>x[1]));
  results.forEach((r,i)=>{
    const key=jobs[i][0];
    if(r.status==="fulfilled") state[key]=r.value||[];
    else {
      state[key]=[];
      console.warn("Could not load "+key,r.reason);
    }
  });
}
function top(title,sub,button=""){return`<div class="topbar"><div class="title"><h2>${title}</h2><p>${sub}</p></div>${button}</div>`}
function card(label,value,sub=""){return`<div class="card"><div class="kicker">${label}</div><div class="big">${value}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`}
function empty(msg){return`<div class="empty">${msg}</div>`}

function renderDashboard(){
  const now=new Date(),month=MONTHS[now.getMonth()],year=now.getFullYear();
  const current=state.payments.filter(p=>p.month===month&&Number(p.year)===year),paid=new Set(current.map(p=>p.student_id));
  const unpaid=state.students.filter(s=>!paid.has(s.id)).length,total=state.payments.reduce((a,p)=>a+Number(p.amount||0),0);
  const recent=[...state.payments].slice(0,6);
  return top("Overview","Simple view of the school today")+
  `<div class="cards">${card("Students",state.students.length)}${card("Faculty",state.professors.length)}${card("Classes",state.classes.length)}${card("Total collected",money(total),unpaid+" unpaid this month")}</div>
  <div class="panel"><div class="panel-head"><h3>Recent payments</h3><button class="btn light sm" onclick="go('payments')">Open payments</button></div>
  ${recent.length?`<div class="table-wrap"><table><thead><tr><th>Student</th><th>Month</th><th>Amount</th><th>Method</th></tr></thead><tbody>${recent.map(p=>`<tr><td><b>${esc(p.student_name||"Unknown")}</b></td><td>${esc(p.month)} ${esc(p.year)}</td><td>${money(p.amount)}</td><td>${esc(p.method||"cash")}</td></tr>`).join("")}</tbody></table></div>`:empty("No payments yet.")}</div>`;
}

function studentRows(rows){
  if(!rows.length)return`<tr><td colspan="6">${empty("No students found.")}</td></tr>`;
  return rows.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="muted">${esc(s.level||"")}</div></td><td>${esc(s.instrument||"—")}</td><td>${esc(s.class_name||"—")}</td><td>${esc(s.parent_name||"—")}<div class="muted">${esc(s.parent_phone||"")}</div></td><td>${Number(s.attendance||0)}%</td><td><div class="actions"><button class="btn light sm" onclick='studentModal(${JSON.stringify(s.id)})'>Edit</button><button class="btn danger sm" onclick='deleteRow("students",${JSON.stringify(s.id)},${JSON.stringify(s.name)})'>Delete</button></div></td></tr>`).join("")
}
function renderStudents(){
  return top("Students",`${state.students.length} enrolled`,`<button class="btn gold" onclick="studentModal()">Add student</button>`)+
  `<div class="panel"><div class="panel-head"><h3>All students</h3><input id="studentSearch" class="search" placeholder="Search students..."></div><div class="table-wrap"><table id="studentTable"><thead><tr><th>Name</th><th>Instrument</th><th>Class</th><th>Parent</th><th>Attendance</th><th></th></tr></thead><tbody>${studentRows(state.students)}</tbody></table></div></div>`
}

function paymentData(){
  const mp=state.payments.filter(p=>p.month===state.selectedMonth&&Number(p.year)===Number(state.selectedYear)),map={};mp.forEach(p=>map[p.student_id]=p);
  const paid=state.students.filter(s=>map[s.id]),unpaid=state.students.filter(s=>!map[s.id]),total=mp.reduce((a,p)=>a+Number(p.amount||0),0);
  return{mp,map,paid,unpaid,total}
}
function renderPayments(){
  const d=paymentData(),totalAll=state.payments.reduce((a,p)=>a+Number(p.amount||0),0),list=state.paymentTab==="unpaid"?d.unpaid:d.paid;
  const cy=new Date().getFullYear(),years=[cy-1,cy,cy+1],groups={};
  state.payments.forEach(p=>{const k=`${p.year}-${p.month}`;groups[k]??={year:Number(p.year),month:p.month,total:0,rows:[]};groups[k].total+=Number(p.amount||0);groups[k].rows.push(p)});
  const history=Object.values(groups).sort((a,b)=>b.year-a.year||MONTHS.indexOf(b.month)-MONTHS.indexOf(a.month));
  const rows=list.length?list.map(s=>{const p=d.map[s.id];return`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.instrument||"—")}</td><td>${state.paymentTab==="paid"?'<span class="pill paid">Paid</span>':'<span class="pill unpaid">Unpaid</span>'}</td><td>${p?money(p.amount):"—"}</td><td>${state.paymentTab==="unpaid"?`<button class="btn green sm" onclick='paymentModal(null,${JSON.stringify(s.id)})'>Mark paid</button>`:`<div class="actions"><button class="btn light sm" onclick='paymentModal(${JSON.stringify(p.id)})'>Edit</button><button class="btn danger sm" onclick='deleteRow("payments",${JSON.stringify(p.id)},${JSON.stringify(s.name)})'>Delete</button></div>`}</td></tr>`}).join(""):`<tr><td colspan="5">${empty(state.paymentTab==="unpaid"?"Everyone has paid for this month.":"No paid students for this month.")}</td></tr>`;
  const hist=history.length?history.map(g=>`<div class="history-month"><span>${g.month} ${g.year} · ${g.rows.length} payments</span><span>${money(g.total)}</span></div><div class="table-wrap"><table><tbody>${g.rows.map(p=>`<tr><td><b>${esc(p.student_name||"Unknown")}</b></td><td>${esc(p.method||"cash")}</td><td>${money(p.amount)}</td></tr>`).join("")}</tbody></table></div>`).join(""):empty("No payments yet.");
  return top("Payments","See who has paid and who still needs to pay",`<button class="btn gold" onclick="paymentModal()">Record payment</button>`)+
  `<div class="cards">${card("All time",money(totalAll),state.payments.length+" payments")}${card("This month",money(d.total),state.selectedMonth+" "+state.selectedYear)}${card("Paid",d.paid.length)}${card("Unpaid",d.unpaid.length)}</div>
  <div class="panel"><div class="panel-head"><div class="filters"><select id="monthSel">${MONTHS.map(m=>`<option ${m===state.selectedMonth?"selected":""}>${m}</option>`).join("")}</select><select id="yearSel">${years.map(y=>`<option ${y===state.selectedYear?"selected":""}>${y}</option>`).join("")}</select></div><div class="tabs"><button data-paytab="unpaid" class="${state.paymentTab==="unpaid"?"active":""}">Unpaid (${d.unpaid.length})</button><button data-paytab="paid" class="${state.paymentTab==="paid"?"active":""}">Paid (${d.paid.length})</button></div></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Instrument</th><th>Status</th><th>Amount</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="panel"><div class="panel-head"><h3>Payment history</h3></div>${hist}</div>`
}

function renderClasses(){
  const rows=state.classes.length?state.classes.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(c.level||"")}</div></td><td>${esc(c.instrument||"—")}</td><td>${esc(c.professor||"—")}</td><td>${esc(c.day||"—")} · ${esc(c.time||"—")}</td><td>${esc(c.room||"—")}</td><td><div class="actions"><button class="btn light sm" onclick='classModal(${JSON.stringify(c.id)})'>Edit</button><button class="btn danger sm" onclick='deleteRow("classes",${JSON.stringify(c.id)},${JSON.stringify(c.name)})'>Delete</button></div></td></tr>`).join(""):`<tr><td colspan="6">${empty("No classes yet.")}</td></tr>`;
  return top("Classes",`${state.classes.length} active classes`,`<button class="btn gold" onclick="classModal()">Add class</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Class</th><th>Instrument</th><th>Professor</th><th>Schedule</th><th>Room</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`
}
function renderProfessors(){
  const rows=state.professors.length?state.professors.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.instrument||"—")}</td><td>${esc(p.email||"—")}</td><td>${esc(p.phone||"—")}</td><td>${Number(p.total_students||0)}</td><td><div class="actions"><button class="btn light sm" onclick='profModal(${JSON.stringify(p.id)})'>Edit</button><button class="btn danger sm" onclick='deleteRow("professors",${JSON.stringify(p.id)},${JSON.stringify(p.name)})'>Delete</button></div></td></tr>`).join(""):`<tr><td colspan="6">${empty("No professors yet.")}</td></tr>`;
  return top("Faculty",`${state.professors.length} professors`,`<button class="btn gold" onclick="profModal()">Add professor</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Instrument</th><th>Email</th><th>Phone</th><th>Students</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`
}
function renderEvents(){
  const rows=state.events.length?state.events.map(e=>`<tr><td><b>${esc(e.title)}</b></td><td>${fmtDate(e.date)}</td><td>${esc(e.type||"—")}</td><td>${esc(e.description||"—")}</td><td><div class="actions"><button class="btn light sm" onclick='eventModal(${JSON.stringify(e.id)})'>Edit</button><button class="btn danger sm" onclick='deleteRow("events",${JSON.stringify(e.id)},${JSON.stringify(e.title)})'>Delete</button></div></td></tr>`).join(""):`<tr><td colspan="5">${empty("No events yet.")}</td></tr>`;
  return top("Events",`${state.events.length} events`,`<button class="btn gold" onclick="eventModal()">Add event</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Event</th><th>Date</th><th>Type</th><th>Description</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`
}

function go(page){state.page=page;render()}
function render(){
  renderNav();
  const views={dashboard:renderDashboard,students:renderStudents,payments:renderPayments,classes:renderClasses,professors:renderProfessors,events:renderEvents};
  $("#view").innerHTML=(views[state.page]||renderDashboard)();
  if(state.page==="students")$("#studentSearch").oninput=e=>{const q=e.target.value.toLowerCase();$("#studentTable tbody").innerHTML=studentRows(state.students.filter(s=>(s.name||"").toLowerCase().includes(q)||(s.instrument||"").toLowerCase().includes(q)))};
  if(state.page==="payments"){ $("#monthSel").onchange=e=>{state.selectedMonth=e.target.value;render()};$("#yearSel").onchange=e=>{state.selectedYear=Number(e.target.value);render()};document.querySelectorAll("[data-paytab]").forEach(b=>b.onclick=()=>{state.paymentTab=b.dataset.paytab;render()})}
}

function field(label,name,value="",type="text",full=false,opts=null){
  const input=opts?`<select name="${name}">${opts.map(o=>{const v=typeof o==="string"?o:o.value,l=typeof o==="string"?o:o.label;return`<option value="${esc(v)}" ${String(v)===String(value)?"selected":""}>${esc(l)}</option>`}).join("")}</select>`:type==="textarea"?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}">`;
  return`<div class="field ${full?"full":""}"><label>${label}</label>${input}</div>`
}
function openModal(title,body,onSave){
  $("#modalRoot").innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" id="closeModal">×</button></div><form id="modalForm"><div class="form">${body}</div><div class="modal-foot"><button type="button" class="btn light" id="cancelModal">Cancel</button><button class="btn gold" type="submit">Save</button></div></form></div></div>`;
  $("#closeModal").onclick=closeModal;$("#cancelModal").onclick=closeModal;$("#modalForm").onsubmit=async e=>{e.preventDefault();try{await onSave(new FormData(e.target));closeModal();await loadAll();render()}catch(err){toast(err.message,"error")}}
}
function closeModal(){$("#modalRoot").innerHTML=""}

  const s=id?state.students.find(x=>x.id===id):{};
  const body=[field("Name","name",s.name||""),field("Date of birth","dob",s.dob||"","date"),field("Instrument","instrument",s.instrument||""),field("Level","level",s.level||"Beginner","text",false,["Beginner","Intermediate","Advanced"]),field("Class","class_name",s.class_name||""),field("Academic year","academic_year",s.academic_year||"2025–2026"),field("Parent name","parent_name",s.parent_name||""),field("Parent phone","parent_phone",s.parent_phone||""),field("Parent email","parent_email",s.parent_email||"","email"),field("Attendance %","attendance",s.attendance||0,"number"),field("Grade","grade",s.grade||""),field("Progress %","progress",s.progress||0,"number"),field("Teacher notes","teacher_notes",s.teacher_notes||"","textarea",true)].join("");
  openModal(id?"Edit student":"Add student",body,async fd=>{const data=Object.fromEntries(fd.entries());data.attendance=Number(data.attendance||0);data.progress=Number(data.progress||0);id?await db.update("students",id,data):await db.insert("students",data);toast(id?"Student updated":"Student added")})
}

}

async function deleteRow(table,id,label){if(!confirm(`Delete ${label}?`))return;try{await db.remove(table,id);toast("Deleted");await loadAll();render()}catch(e){toast(e.message,"error")}}

async function startApp(user){
  state.user=user;
  state.profile={full_name:user?.email||"Admin",role:"admin",email:user?.email||""};

  $("#userMini").innerHTML=`<b>${esc(user?.email||"Admin")}</b>`;
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");

  // Open the admin immediately. Database loading happens after the UI is visible.
  render();

  try{
    await loadAll();
    render();
  }catch(e){
    console.error("Data load error",e);
    toast("Signed in, but some data could not load.","error");
  }
}

async function restoreSession(){
  if(!state.token) return;
  try{
    const user=await getUser(state.token);
    await startApp(user);
  }catch(e){
    console.warn("Saved session invalid",e);
    localStorage.removeItem("misbah_admin_token");
    state.token="";
  }
}

async function loginNow(){
  const btn=$("#loginBtn");
  const status=$("#loginStatus");
  const error=$("#loginError");
  const email=$("#loginEmail").value.trim();
  const password=$("#loginPassword").value;

  error.textContent="";
  status.textContent="";

  if(!email || !password){
    error.textContent="Please enter email and password.";
    return;
  }

  btn.disabled=true;
  btn.textContent="Signing in...";
  status.textContent="Connecting to the school database...";

  try{
    const d=await signIn(email,password);

    if(!d || !d.access_token || !d.user){
      throw new Error("Login response was incomplete.");
    }

    state.token=d.access_token;
    localStorage.setItem("misbah_admin_token",state.token);

    status.textContent="Login successful. Opening admin...";
    await startApp(d.user);
  }catch(e){
    console.error("Login failed",e);
    error.textContent=e?.message || "Login failed.";
    status.textContent="";
    localStorage.removeItem("misbah_admin_token");
    state.token="";
  }finally{
    btn.disabled=false;
    btn.textContent="Sign in";
  }
}

$("#loginForm").addEventListener("submit",e=>{
  e.preventDefault();
  loginNow();
});

$("#logoutBtn").onclick=()=>{
  localStorage.removeItem("misbah_admin_token");
  state.token="";
  location.reload();
};

// If a browser/runtime error happens before login, show it instead of silently staying stuck.
window.addEventListener("error",e=>{
  const box=document.querySelector("#loginError");
  if(box && !document.querySelector("#login")?.classList.contains("hidden")){
    box.textContent="Page error: "+(e.message||"Unknown error");
  }
});
window.addEventListener("unhandledrejection",e=>{
  const box=document.querySelector("#loginError");
  if(box && !document.querySelector("#login")?.classList.contains("hidden")){
    box.textContent="Connection error: "+(e.reason?.message||String(e.reason||"Unknown error"));
  }
});

restoreSession();
</script>
