// ─── SUPABASE ─────────────────────────────────────────────────────────────────
const sb = {
  headers: {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
  },
  url: (t, q = "") => `${SUPABASE_URL}/rest/v1/${t}${q}`,
  authUrl: p => `${SUPABASE_URL}/auth/v1/${p}`,
  async select(t, q = "") {
    const r = await fetch(this.url(t, q), {
      headers: this.headers
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async insert(t, d) {
    const r = await fetch(this.url(t), {
      method: "POST",
      headers: this.headers,
      body: JSON.stringify(d)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async update(t, id, d) {
    const r = await fetch(this.url(t, `?id=eq.${id}`), {
      method: "PATCH",
      headers: this.headers,
      body: JSON.stringify(d)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async remove(t, id) {
    const r = await fetch(this.url(t, `?id=eq.${id}`), {
      method: "DELETE",
      headers: this.headers
    });
    if (!r.ok) throw new Error(await r.text());
    return true;
  },
  async signIn(email, password) {
    const r = await fetch(this.authUrl("token?grant_type=password"), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({
        email,
        password
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error_description || "Hyrja dështoi");
    return d;
  },
  async signOut(token) {
    await fetch(this.authUrl("logout"), {
      method: "POST",
      headers: {
        ...this.headers,
        "Authorization": `Bearer ${token}`
      }
    });
  },
  setToken(t) {
    this.headers["Authorization"] = `Bearer ${t}`;
  }
};

const useMedia = () => {
  const [w, setW] = useState(typeof window !== "undefined" ? window.innerWidth : 1200);
  useEffect(() => {
    const h = () => setW(window.innerWidth);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return {
    isMobile: w < 768,
    isTablet: w >= 768 && w < 1024
  };
};
